---
# Major-version ranges match what an unconstrained build resolved on
# 2026-09-11 (netcommon 8.6.2, junos 11.1.1, iosxr 12.4.2, eos 12.2.0), so a
# rebuild keeps the tested vendor terminal/cliconf drivers rather than silently
# adopting a future major release. Raise a range deliberately after testing.
collections:
  - name: ansible.netcommon
    version: ">=8.0.0,<9.0.0"
  - name: junipernetworks.junos
    version: ">=11.0.0,<12.0.0"
  - name: cisco.iosxr
    version: ">=12.0.0,<13.0.0"
  - name: arista.eos
    version: ">=12.0.0,<13.0.0"
