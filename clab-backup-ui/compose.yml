services:
  backup-ui:
    build: .
    image: clab-backup:1.6.0
    restart: unless-stopped
    ports:
      - '${UI_BIND:-0.0.0.0}:${UI_PORT:-8080}:8080'
    networks:
      - management
    volumes:
      - worker-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
networks:
  management:
    external: true
    name: ${CLAB_NETWORK:-clab}
volumes:
  worker-data:
    name: nos-backup-ui-data
