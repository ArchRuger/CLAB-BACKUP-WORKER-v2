name: containerlab-node-manager
services:
  backup-ui:
    build: .
    image: clab-backup:1.30.23
    restart: unless-stopped
    network_mode: host
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "${UI_BIND:-0.0.0.0}", "--port", "${UI_PORT:-8081}", "--workers", "1"]
    environment:
      DATA_DIR: /data
      CAPTURE_PROVIDER: ${CAPTURE_PROVIDER:-disabled}
      CAPTURE_EDGESHARK_URL: ${CAPTURE_EDGESHARK_URL:-}
      CAPTURE_SESSION_URL: ${CAPTURE_SESSION_URL:-http://127.0.0.1:5801}
      CAPTURE_SESSION_TOKEN: ${CAPTURE_SESSION_TOKEN:-}
      TELEMETRY_COLLECTOR: ${TELEMETRY_COLLECTOR:-gnmi}
      TELEMETRY_STACK: ${TELEMETRY_STACK:-disabled}
      TELEMETRY_GRAFANA_PORT: ${TELEMETRY_GRAFANA_PORT:-3000}
      TELEMETRY_PROMETHEUS_PORT: ${TELEMETRY_PROMETHEUS_PORT:-9090}
      TELEMETRY_GRAFANA_IDLE_MINUTES: ${TELEMETRY_GRAFANA_IDLE_MINUTES:-15}
    volumes:
      - type: bind
        source: /srv/containerlab-node-manager/data
        target: /data
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
