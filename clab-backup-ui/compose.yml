name: containerlab-node-manager
services:
  backup-ui:
    build: .
    image: clab-backup:1.31.8
    restart: unless-stopped
    network_mode: host
    # uvicorn terminates TLS itself with the files setup-tls.sh put in the tls directory (fixed paths,
    # nothing in .env can point elsewhere); --no-proxy-headers so no header rewrites the scheme or the
    # client address; --no-server-header drops "server: uvicorn".
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "${UI_BIND:-0.0.0.0}", "--port", "${UI_PORT:-8443}", "--workers", "1", "--ssl-certfile", "/tls/cert.pem", "--ssl-keyfile", "/tls/key.pem", "--no-proxy-headers", "--no-server-header"]
    environment:
      DATA_DIR: /data
      UI_PORT: ${UI_PORT:-8443}
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-}
      CAPTURE_PROVIDER: ${CAPTURE_PROVIDER:-disabled}
      CAPTURE_EDGESHARK_URL: ${CAPTURE_EDGESHARK_URL:-}
      CAPTURE_SESSION_URL: ${CAPTURE_SESSION_URL:-http://127.0.0.1:5801}
      CAPTURE_SESSION_TOKEN: ${CAPTURE_SESSION_TOKEN:-}
    volumes:
      - type: bind
        source: /srv/containerlab-node-manager/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/containerlab-node-manager/tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
  # The one listener outside the gate and the guard: no data, no mounts; it answers 301 to the
  # manager's own HTTPS origin and nothing else. UI_HTTP_PORT=0 keeps the container idle.
  http-redirect:
    image: clab-backup:1.31.8
    restart: unless-stopped
    network_mode: host
    read_only: true
    command: ["python", "-m", "app.redirect"]
    environment:
      UI_BIND: ${UI_BIND:-0.0.0.0}
      UI_PORT: ${UI_PORT:-8443}
      UI_HTTP_PORT: ${UI_HTTP_PORT:-8081}
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
