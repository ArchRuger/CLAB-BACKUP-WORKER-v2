# The dashboards are files in the repository; edits in the Grafana UI are not saved.
apiVersion: 1
providers:
  - name: containerlab-node-manager
    folder: Containerlab Node Manager
    folderUid: clab-node-manager
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
