# The dashboards are files in the repository; edits in the Grafana UI are not saved.
apiVersion: 1
providers:
  - name: containerlab-node-manager
    folder: Containerlab Node Manager
    folderUid: clab-node-manager
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
  # Lab maps: one file per drawn lab, generated by the manager (app/telemetry_map.py) into its data
  # directory and mounted here read-only. A lab removed from the manager removes its dashboard.
  - name: containerlab-node-manager-lab-maps
    folder: Lab maps
    folderUid: clab-lab-maps
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards-labs
      foldersFromFilesStructure: false
