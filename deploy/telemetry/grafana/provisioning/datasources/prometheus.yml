# Provisioned data source: the local Prometheus that scrapes the manager. Read-only in the UI.
apiVersion: 1
datasources:
  - name: Containerlab Node Manager
    uid: clab-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:${TELEMETRY_PROMETHEUS_PORT}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST
