# Optional Grafana dashboards for the manager's session telemetry, isolated from the
# manager's Compose project. Host networking, like the manager: Prometheus scrapes
# 127.0.0.1:<UI_PORT>/api/telemetry/metrics every 10 s and listens on 127.0.0.1 only;
# Grafana serves the provisioned dashboards on <TELEMETRY_GRAFANA_BIND>:<TELEMETRY_GRAFANA_PORT>.
# Both data directories are tmpfs-backed volumes with a two-hour retention: nothing
# survives a host reboot or a stack removal, matching the manager's session-only design.
# Public multi-architecture manifests resolved 2026-09-13; no moving latest tags.
name: clab-manager-telemetry
services:
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0  # v3.14.0
    restart: unless-stopped
    network_mode: host
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=200MB
      - --web.listen-address=127.0.0.1:${TELEMETRY_PROMETHEUS_PORT:-9090}
    volumes:
      - type: bind
        source: ${TELEMETRY_CONFIG_DIR:-/srv/containerlab-node-manager/telemetry}/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
  grafana:
    image: grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2  # 13.0.2
    restart: unless-stopped
    network_mode: host
    user: "472:472"
    depends_on: [prometheus]
    environment:
      GF_SERVER_HTTP_ADDR: ${TELEMETRY_GRAFANA_BIND:-0.0.0.0}
      GF_SERVER_HTTP_PORT: ${TELEMETRY_GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${TELEMETRY_GRAFANA_ADMIN_PASSWORD:?Run sudo bash deploy/setup-telemetry.sh first}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # No background installs of Grafana's bundled apps: the plugin folder is read-only and the VM
      # may be offline; the only plugin (the Flow panel) is installed by setup-telemetry.sh.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/lab-overview.json
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_PLUGINS: /var/lib/grafana-plugins
      TELEMETRY_PROMETHEUS_PORT: ${TELEMETRY_PROMETHEUS_PORT:-9090}
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/etc/grafana/dashboards:ro
      # The Flow panel (lab maps), installed once by setup-telemetry.sh; read-only so Grafana never
      # changes it, and outside the tmpfs data volume so a restart works offline.
      - type: bind
        source: ${TELEMETRY_CONFIG_DIR:-/srv/containerlab-node-manager/telemetry}/plugins
        target: /var/lib/grafana-plugins
        read_only: true
        bind:
          create_host_path: false
      # One generated lab-map dashboard per lab, written by the manager into its data directory.
      - type: bind
        source: ${TELEMETRY_MAPS_DIR:-/srv/containerlab-node-manager/data/telemetry/dashboards}
        target: /etc/grafana/dashboards-labs
        read_only: true
        bind:
          create_host_path: false
      - grafana-data:/var/lib/grafana
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
volumes:
  prometheus-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=65534,gid=65534,mode=0700
  grafana-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=472,gid=472,mode=0700
