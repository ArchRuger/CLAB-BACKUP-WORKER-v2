name: Release consistency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source versions
        run: python3 deploy/verify-release.py
      - name: Check release and helper regression tests
        working-directory: clab-backup-ui
        run: |
          python3 -m unittest discover -s tests -p test_release_consistency.py -v
          python3 -m unittest discover -s tests -p test_helper_preflight.py -v
