name: Release consistency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source versions
        run: python3 deploy/verify-release.py
      - name: Check release and helper regression tests
        working-directory: clab-backup-ui
        run: |
          python3 -m unittest discover -s tests -p test_release_consistency.py -v
          python3 -m unittest discover -s tests -p test_helper_preflight.py -v
          python3 -m unittest discover -s tests -p test_install_manager.py -v
          python3 -m unittest discover -s tests -p test_git_onboard.py -v
          python3 -m unittest discover -s tests -p test_git_registrations.py -v
          python3 -m unittest discover -s tests -p test_apt_sources.py -v
          python3 -m unittest discover -s tests -p test_apt_update.py -v
          python3 -m unittest discover -s tests -p test_check_install.py -v
          python3 -m unittest discover -s tests -p test_check_host.py -v
          python3 -m unittest discover -s tests -p test_check_git.py -v
      - name: Check installer shell syntax
        run: |
          for script in deploy/install.sh deploy/install-prerequisites.sh deploy/setup-git.sh deploy/start-manager.sh deploy/check-install.sh; do
            bash -n "$script"
          done
      - name: Install application test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/clab-test-venv"
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m pip install -r clab-backup-ui/requirements.txt 'httpx>=0.27,<1'
      - name: Check Junos kind support
        working-directory: clab-backup-ui
        run: '"$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_junos_kinds.py -v'
