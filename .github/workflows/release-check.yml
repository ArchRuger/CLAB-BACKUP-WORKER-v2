name: Release consistency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source versions and that the documentation names the current release only
        run: python3 deploy/verify-release.py
      - name: Check release and helper regression tests
        working-directory: clab-backup-ui
        run: |
          python3 -m unittest discover -s tests -p test_release_consistency.py -v
          python3 -m unittest discover -s tests -p test_helper_preflight.py -v
          python3 -m unittest discover -s tests -p test_gateway_preflight.py -v
          python3 -m unittest discover -s tests -p test_install_manager.py -v
          python3 -m unittest discover -s tests -p test_git_onboard.py -v
          python3 -m unittest discover -s tests -p test_git_registrations.py -v
          python3 -m unittest discover -s tests -p test_scaffold_lab.py -v
          python3 -m unittest discover -s tests -p test_apt_sources.py -v
          python3 -m unittest discover -s tests -p test_apt_update.py -v
          python3 -m unittest discover -s tests -p test_check_install.py -v
          python3 -m unittest discover -s tests -p test_check_host.py -v
          python3 -m unittest discover -s tests -p test_check_git.py -v
      - name: Check installer shell syntax
        run: |
          for script in deploy/install.sh deploy/install-prerequisites.sh deploy/setup-git.sh deploy/start-manager.sh deploy/check-install.sh deploy/setup-engineer-access.sh deploy/setup-capture.sh deploy/setup-telemetry.sh deploy/recreate-manager.sh deploy/setup-vm.sh deploy/setup-discovery.sh deploy/setup-operations.sh deploy/setup-password.sh deploy/migrate-worker-data.sh; do
            bash -n "$script"
          done
      - name: Install application test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/clab-test-venv"
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m pip install -r clab-backup-ui/requirements.txt 'httpx>=0.27,<1'
      - name: Check Junos kind support
        working-directory: clab-backup-ui
        run: '"$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_junos_kinds.py -v'
      - name: Check operations SSH and lab actions
        working-directory: clab-backup-ui
        run: |
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_operations_ssh.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_lab_operations.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_diagnostics.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_rpc_completion.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_background_recovery.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_git_command_timeout.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_git_progress.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_git_transport.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_host_git.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_restore.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_restore_junos.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_discovery_ssh.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_discovery_sftp.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_helper_timeout.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_runner_resilience.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -p test_logging.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -t tests -p test_node_readiness.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -t tests -p test_vm_files.py -v
          "$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -t tests -p test_grafana_control.py -v
      - name: Check network telemetry
        working-directory: clab-backup-ui
        run: '"$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -t tests -p "test_telemetry*.py" -v'
      - name: Check browser regressions
        working-directory: clab-backup-ui
        run: node --test tests/test_operations_ui.js tests/test_debug_ui.js tests/test_capture_ui.js tests/test_capture_session_ui.js tests/test_topology_ui.js tests/test_vm_password_ui.js tests/test_readiness_ui.js tests/test_download_ui.js tests/test_grafana_ui.js tests/test_git_progress_ui.js tests/test_git_places_ui.js tests/test_restore_ui.js tests/test_status_ui.js tests/test_shell_ui.js tests/test_home_ui.js tests/test_diagram_editor_ui.js tests/test_topology_menu_ui.js
      - name: Check optional capture provider
        working-directory: clab-backup-ui
        run: '"$RUNNER_TEMP/clab-test-venv/bin/python" -m unittest discover -s tests -t tests -p "test_capture*.py" -v'
      - name: Validate isolated capture deployment
        env:
          CAPTURE_SESSION_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f deploy/compose.capture.yml config --quiet
      - name: Validate telemetry dashboards deployment
        env:
          TELEMETRY_GRAFANA_ADMIN_PASSWORD: fixture-password-not-secret
        run: docker compose -f deploy/compose.telemetry.yml config --quiet
      - name: Start the real Grafana dashboards stack against a fixture manager
        timeout-minutes: 10
        run: python3 deploy/telemetry/smoke.py
      - name: Exercise browser Wireshark and real loopback packets
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/clab-test-venv/bin/python" deploy/capture/smoke.py'
