name: Release consistency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source versions
        run: python3 deploy/verify-release.py
      - name: Check release and helper regression tests
        working-directory: clab-backup-ui
        run: |
          python3 -m unittest discover -s tests -p test_release_consistency.py -v
          python3 -m unittest discover -s tests -p test_helper_preflight.py -v
          python3 -m unittest discover -s tests -p test_install_manager.py -v
          python3 -m unittest discover -s tests -p test_git_onboard.py -v
          python3 -m unittest discover -s tests -p test_git_registrations.py -v
          python3 -m unittest discover -s tests -p test_apt_sources.py -v
      - name: Check installer shell syntax
        run: |
          for script in deploy/install.sh deploy/install-prerequisites.sh deploy/setup-git.sh deploy/start-manager.sh; do
            bash -n "$script"
          done
